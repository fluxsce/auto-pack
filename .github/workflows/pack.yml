# auto-pack 发行打包。
# 触发：
#   - 推 master：package.json 版本相对已有 v* tag 未发布，且 CHANGELOG
#    （Unreleased 或同号章节）有说明 → 自动打包、打 tag、发 GitHub Release
#   - 推 v* 标签：校验与 package.json 一致后打包并发 Release（已有 Release 资产则跳过）
#   - 手动 Run workflow：只打 Artifact，不发版
# 约定：
#   - 全程钉死触发提交 SHA，不回写 master / 不改 CHANGELOG（避免与本地抢分支）
#   - Release 正文由 cut_changelog.py --notes-only 临时生成
#   - 建议发版提交里已把 Unreleased 收成 ## [x.y.z] - 日期（也可仍留在 Unreleased）
# 私人仓库只留最近一次构建 Artifact（保留 1 天，成功后删掉旧包）。
# ensis-ui 从 npm 拉取，不 checkout 兄弟仓。
name: Pack

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      niuma_ui_version:
        description: npm 上的 ensis-ui 版本（如 latest 或 1.3.1）
        type: string
        default: 'latest'

concurrency:
  # 同一分支/标签只跑最新一次；用 ref 分组，取消过期运行，避免并行发同版本。
  group: pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  decide:
    name: Decide release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      pack: ${{ steps.plan.outputs.pack }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      commit: ${{ steps.plan.outputs.commit }}
      niuma_ui_version: ${{ steps.plan.outputs.niuma_ui_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          ui="${{ github.event.inputs.niuma_ui_version }}"
          if [ -z "${ui}" ]; then
            ui="${{ vars.NIUMA_UI_VERSION || 'latest' }}"
          fi
          echo "niuma_ui_version=${ui}" >> "$GITHUB_OUTPUT"

          # 兼容历史：旧流水线曾回写 [release notes] 提交；现已不再产生。
          if git log -1 --format=%s | grep -F '[release notes]' >/dev/null; then
            echo "legacy release-notes commit; skip"
            echo "pack=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PKG="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          DATE="$(date -u +%Y-%m-%d)"
          PUBLISHED="$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | paste -sd, -)"

          release_exists() {
            local ver="$1"
            gh release view "v${ver}" >/dev/null 2>&1
          }

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tag ${TAG} is not SemVer vX.Y.Z" >&2
              exit 1
            fi
            if [ "${VERSION}" != "${PKG}" ]; then
              echo "Tag version (${VERSION}) != package.json version (${PKG})" >&2
              exit 1
            fi
            # 自动发版会先 create Release 再产生 tag 事件；已有 Release 则跳过，避免双跑。
            if release_exists "${VERSION}"; then
              echo "v${VERSION} release already exists; skip"
              echo "pack=false" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pack=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual pack; artifacts only"
            echo "pack=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=${PKG}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # master push: auto-release when package.json version is unpublished and has notes
          VERSION="$(python3 .github/scripts/cut_changelog.py plan \
            --version "${PKG}" \
            --published "${PUBLISHED}" \
            --date "${DATE}" \
            --notes release-notes.md)"
          if [ -z "${VERSION}" ]; then
            echo "no unpublished changelog notes for ${PKG}; skip"
            echo "pack=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists; skip"
            echo "pack=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if release_exists "${VERSION}"; then
            echo "v${VERSION} release already exists; skip"
            echo "pack=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "auto-release v${VERSION} @ ${GITHUB_SHA}"
          echo "pack=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=auto" >> "$GITHUB_OUTPUT"

  pack:
    name: pack (${{ matrix.target }}-amd64)
    needs: decide
    if: needs.decide.outputs.pack == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux
          - runner: windows-2022
            target: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euo pipefail
          UI="${{ needs.decide.outputs.niuma_ui_version }}"
          pnpm pkg set "dependencies.@niuma/ui=npm:ensis-ui@${UI}"
          pnpm install --no-frozen-lockfile

      - name: Verify package.json version
        if: needs.decide.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          WANT="${{ needs.decide.outputs.version }}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$PKG" ]; then
            echo "Planned version ($WANT) != package.json version ($PKG)" >&2
            exit 1
          fi
          echo "packing ${WANT} @ $(git rev-parse --short HEAD)"

      - name: Pack Linux
        if: matrix.target == 'linux'
        run: bash script/build/linux.sh

      - name: Pack Windows
        if: matrix.target == 'windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File script/build/windows.ps1

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-pack-${{ needs.decide.outputs.version }}-${{ matrix.target }}-amd64
          path: |
            build/dist/*.tar.gz
            build/dist/*.zip
          if-no-files-found: error
          retention-days: 1

  prune-artifacts:
    name: Keep latest artifacts
    needs: [decide, pack]
    if: ${{ success() && needs.decide.outputs.pack == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Delete older auto-pack artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const keepRun = context.runId
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            })
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith('auto-pack-')) continue
              const runId = artifact.workflow_run && artifact.workflow_run.id
              if (runId === keepRun) continue
              core.info(`delete ${artifact.name} #${artifact.id} (run ${runId})`)
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              })
            }

  publish:
    name: GitHub Release
    needs: [decide, pack]
    if: ${{ success() && needs.decide.outputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.commit }}
          fetch-depth: 0

      - name: Download pack artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: auto-pack-${{ needs.decide.outputs.version }}-*-amd64
          merge-multiple: true
          path: release-files

      - name: Checksums
        working-directory: release-files
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Publish release notes only (no master push)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
          TAG: ${{ needs.decide.outputs.tag }}
          MODE: ${{ needs.decide.outputs.mode }}
          COMMIT: ${{ needs.decide.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          # 只写临时 release-notes.md，不改 CHANGELOG、不 push master。
          python3 .github/scripts/cut_changelog.py apply \
            --version "${VERSION}" \
            --date "${DATE}" \
            --notes release-notes.md \
            --notes-only

          # 先发 Release（--target 钉死打包 SHA），tag 事件进来时若已有 Release 则跳过。
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              release-files/*.tar.gz \
              release-files/*.zip \
              release-files/SHA256SUMS.txt \
              --clobber
            gh release edit "${TAG}" --notes-file release-notes.md
          elif [ "${MODE}" = "auto" ]; then
            gh release create "${TAG}" \
              --target "${COMMIT}" \
              --title "auto-pack ${TAG}" \
              --notes-file release-notes.md \
              release-files/*.tar.gz \
              release-files/*.zip \
              release-files/SHA256SUMS.txt
          else
            gh release create "${TAG}" \
              --target "${COMMIT}" \
              --title "auto-pack ${TAG}" \
              --notes-file release-notes.md \
              release-files/*.tar.gz \
              release-files/*.zip \
              release-files/SHA256SUMS.txt
          fi
