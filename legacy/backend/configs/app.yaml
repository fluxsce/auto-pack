# autopack 应用配置（默认开发/发布均可使用，发版时随 configs/ 目录一并拷贝）

server:
  # 监听地址，格式 host:port 或 :port
  addr: ":8080"

database:
  # SQLite 文件路径（相对路径基于 configs 目录的上一级，即应用根目录）
  path: "./data/db/autopack.db"

web:
  jwt_secret: "auto-pack-dev-secret-change-in-production"
  frontend:
    # 前端 dist 目录；留空则自动解析：可执行文件同目录 web/，或开发时 ../frontend/dist
    path: ""

log:
  level: info
  # 日志文件（相对路径基于应用根目录）；轮转：单文件最大 max_size_mb，保留 max_backups 个历史文件
  file: "./logs/autopack.log"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 0
  also_stdout: true

# Git 工作区同步 / 发版克隆的全局浅克隆深度（对应 git clone|fetch --depth）
git:
  # 默认 50：兼顾大仓库拉取速度与发版近期历史需求。
  # - >0：浅克隆/浅拉取，只保留最近 N 个提交（单分支仍由 --single-branch 约束）
  # - 0 ：完整历史（最慢，历史里若误提交过 target/*.jar 等会非常大）
  # 发版相关风险（降低数值前请评估）：
  # - 过小（如 1）时，本地缺少较旧提交，merge-base / 基于非 tip 的操作更容易失败
  # - 从「很老的版本 Tag」拉出发版分支：Tag 按需 fetch 不带 --depth，一般仍可用
  # - 已有完整克隆的工作区不会自动变小；需清工作区后重新同步才会按此深度拉取
  clone_depth: 50
  # 同时允许预同步的工作空间数量（按工作空间互斥，不同工作空间可并行）。
  # 默认 2：避免 V9 同步时完全挡住 V10，同时限制磁盘/网卡压力。
  # 设为 1 则恢复「全局同时只同步一个工作空间」的旧行为。
  sync_max_workspaces: 2
